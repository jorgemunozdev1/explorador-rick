<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Explorador Rick and Morty</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --portal: #97ce4c;
        --portal-glow: #b8f35a;
        --morty: #f0e14a;
        --rick: #44c8f5;
        --bg: #0b0f1a;
        --panel: #141a2b;
        --texto: #e8f0e0;
        --muted: #8a94a8;
        --danger: #ff4d6d;
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Rubik", system-ui, sans-serif;
        color: var(--texto);
        max-width: 1000px;
        margin: 0 auto;
        padding: 2rem 1rem 4rem;
        min-height: 100vh;
        background:
          radial-gradient(
            circle at 50% -10%,
            rgba(151, 206, 76, 0.25),
            transparent 45%
          ),
          radial-gradient(1px 1px at 20% 30%, #fff8, transparent),
          radial-gradient(1px 1px at 70% 60%, #fff6, transparent),
          radial-gradient(1.5px 1.5px at 40% 80%, #fff7, transparent),
          radial-gradient(1px 1px at 85% 15%, #fff9, transparent),
          radial-gradient(1px 1px at 10% 70%, #fff5, transparent), var(--bg);
        background-attachment: fixed;
      }

      /* ---------- Título ---------- */
      h1 {
        font-family: "Creepster", cursive;
        font-weight: 400;
        font-size: clamp(2.4rem, 7vw, 4.2rem);
        letter-spacing: 2px;
        text-align: center;
        margin: 0 0 1.5rem;
        color: var(--portal);
        text-shadow:
          0 0 8px var(--portal-glow),
          0 0 24px rgba(151, 206, 76, 0.6),
          3px 3px 0 #2a5d1a;
        animation: flotar 4s ease-in-out infinite;
      }

      @keyframes flotar {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-6px) rotate(1deg);
        }
      }

      /* ---------- Controles ---------- */
      #buscador,
      #estadoFiltro {
        font: inherit;
        color: var(--texto);
        background: var(--panel);
        border: 2px solid #2b3550;
        border-radius: 999px;
        padding: 0.75rem 1.2rem;
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }
      #buscador {
        width: min(100%, 420px);
        margin-right: 0.5rem;
        margin-bottom: 0.5rem;
      }
      #estadoFiltro {
        cursor: pointer;
      }
      #buscador::placeholder {
        color: var(--muted);
      }
      #buscador:focus,
      #estadoFiltro:focus {
        border-color: var(--portal);
        box-shadow:
          0 0 0 4px rgba(151, 206, 76, 0.25),
          0 0 18px rgba(151, 206, 76, 0.4);
      }

      /* ---------- Estado / errores ---------- */
      #estado {
        min-height: 2.2rem;
        padding: 0.5rem 1rem;
        margin: 1rem 0;
        color: var(--muted);
        font-style: italic;
      }
      #estado:empty {
        visibility: hidden;
      }
      .error {
        color: var(--danger) !important;
        font-style: normal !important;
        background: rgba(255, 77, 109, 0.1);
        border-left: 4px solid var(--danger);
        border-radius: 8px;
        animation: temblor 0.4s;
      }
      .error::before {
        content: "💀 ";
      }

      @keyframes temblor {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      /* ---------- Grid y tarjetas ---------- */
      #grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 1.25rem;
        margin-bottom: 2rem;
      }

      .card {
        position: relative;
        background: var(--panel);
        border: 2px solid #232c44;
        border-radius: var(--radius);
        overflow: hidden;
        transition:
          transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1),
          border-color 0.25s,
          box-shadow 0.25s;
        animation: aparecer 0.5s ease both;
      }
      /* entrada escalonada */
      .card:nth-child(4n + 2) {
        animation-delay: 0.05s;
      }
      .card:nth-child(4n + 3) {
        animation-delay: 0.1s;
      }
      .card:nth-child(4n + 4) {
        animation-delay: 0.15s;
      }

      @keyframes aparecer {
        from {
          opacity: 0;
          transform: scale(0.6) rotate(-8deg);
          filter: hue-rotate(90deg) blur(4px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: none;
        }
      }

      .card:hover {
        transform: translateY(-8px) scale(1.04);
        border-color: var(--portal);
        box-shadow:
          0 0 0 1px var(--portal),
          0 12px 30px rgba(151, 206, 76, 0.35);
      }

      .card img {
        width: 100%;
        display: block;
        aspect-ratio: 1;
        object-fit: cover;
        transition:
          transform 0.4s,
          filter 0.4s;
      }
      .card:hover img {
        transform: scale(1.08);
        filter: saturate(1.3);
      }

      .card p {
        margin: 0;
        padding: 0.75rem 0.8rem 0.9rem;
        font-size: 0.9rem;
        line-height: 1.35;
        font-weight: 600;
      }

      /* ---------- Paginación ---------- */
      #anterior,
      #siguiente {
        font: inherit;
        font-size: 1.2rem;
        width: 3rem;
        height: 3rem;
        border: none;
        border-radius: 50%;
        cursor: pointer;
        color: #0b0f1a;
        background: radial-gradient(
          circle at 35% 35%,
          var(--portal-glow),
          var(--portal) 60%,
          #3f7a1f
        );
        box-shadow: 0 0 14px rgba(151, 206, 76, 0.6);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      #anterior:hover:not(:disabled),
      #siguiente:hover:not(:disabled) {
        transform: rotate(360deg) scale(1.15);
        box-shadow: 0 0 28px var(--portal-glow);
        transition:
          transform 0.6s,
          box-shadow 0.2s;
      }
      #anterior:disabled,
      #siguiente:disabled {
        filter: grayscale(1);
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }

      #pagina {
        display: inline-block;
        min-width: 6rem;
        text-align: center;
        font-weight: 800;
        color: var(--morty);
        margin: 0 0.5rem;
      }

      body > button,
      body > span {
        vertical-align: middle;
      }

      /* ---------- Responsive ---------- */
      @media (max-width: 500px) {
        #grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 0.8rem;
        }
        #buscador {
          width: 100%;
          margin-right: 0;
        }
        #estadoFiltro {
          width: 100%;
        }
      }

      .card[data-status="Alive"] {
        border-top: 4px solid var(--portal);
      }
      .card[data-status="Dead"] {
        border-top: 4px solid var(--danger);
        filter: grayscale(0.6);
      }
      .card[data-status="unknown"] {
        border-top: 4px solid var(--muted);
      }
    </style>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <h1>🛸 Explorador Rick and Morty</h1>
    <input id="buscador" type="search" placeholder="Buscar personaje…" />
    <select id="estadoFiltro">
      <option value="">Todos</option>
      <option value="alive">Vivos</option>
      <option value="dead">Muertos</option>
      <option value="unknown">Desconocido</option>
    </select>
    <p id="estado"></p>
    <div id="grid"></div>
    <button id="anterior">◀</button>
    <span id="pagina"></span>
    <button id="siguiente">▶</button>
  </body>
</html>
